# millwright — every service on srv1491903 runs from this file (single process
# manager, product invariant). Only caddy publishes ports; everything else is
# reachable through it or via `docker exec`.
#
# Secrets arrive as env files under /srv/secrets (chmod 700/600), never as
# `environment:` literals — `docker exec todo …` (the todo MCP adapter path)
# inherits the container env, so TODO_TOKEN appears on no command line.
#
# MVP-cliff note: base images are tag-pinned, not digest-pinned. Pin by digest
# (FROM node:24-slim@sha256:…) before promoting past prototype.

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./sites:/srv/sites:ro
      - myron-client-dist:/srv/exploring-elan:ro
      # chg-002: Tiamat wiki, rsync'd from the laptop (wiki repo deploy.sh)
      - /var/www/tiamat:/srv/tiamat:ro
      # chg-004: the practice sign-in page (GET /signin), for web views that can't show the Basic prompt.
      - ./caddy/practice-signin:/srv/practice-signin:ro
      - caddy-data:/data
      - caddy-config:/config
    # chg-003: the practice site's basic-auth user and bcrypt hash, for the Caddyfile's
    # {$PRACTICE_AUTH_USER} / {$PRACTICE_AUTH_HASH}. Required: if the file is missing,
    # `docker compose up` refuses before touching the running caddy. The hash must be
    # single-quoted in the file (an unquoted bcrypt hash is mangled by Compose).
    # chg-004: the same file holds PRACTICE_SESSION_SECRET (64 hex), the sign-in cookie's value.
    env_file:
      - /srv/secrets/practice-auth.env # PRACTICE_AUTH_USER, PRACTICE_AUTH_HASH, PRACTICE_SESSION_SECRET
    # default: every existing site; practice: the internal-only network to the practice app.
    networks:
      - default
      - practice

  todo:
    # Stable name: backup.sh and the ~/.claude.json MCP snippet `docker exec todo …`
    container_name: todo
    build:
      context: /opt/todo/current
      dockerfile_inline: |
        FROM node:24-slim
        # sqlite3 CLI (~2 MB) for the atomic nightly `.backup` (backup.sh)
        RUN apt-get update && apt-get install -y --no-install-recommends sqlite3 \
            && rm -rf /var/lib/apt/lists/*
        WORKDIR /app
        COPY package.json package-lock.json ./
        RUN npm ci --omit=dev
        COPY . .
        CMD ["node", "src/main.ts"]
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "8787"
      TODO_DB: /data/todo.db
    env_file:
      - /srv/secrets/todo.env # TODO_TOKEN
    volumes:
      - todo-data:/data
    expose:
      - "8787"

  myron-api:
    build:
      context: /var/www/exploring-elan/api
      # --ignore-scripts: better-sqlite3 13 ships linux prebuilds but npm still
      # runs an implicit node-gyp rebuild, which fails without python.
      dockerfile_inline: |
        FROM node:26-slim
        WORKDIR /app/api
        COPY package.json package-lock.json ./
        RUN npm ci --ignore-scripts
        COPY . .
        CMD ["npx", "tsx", "src/index.ts"]
    restart: unless-stopped
    environment:
      # The api marks the session cookie Secure only when this is production.
      NODE_ENV: production
      # Accounts for the book-text search gate. The api image is rebuilt from an
      # rsync'd build context, so anything written inside the container is lost
      # on `up --build`; the named volume below is what makes logins survive.
      AUTH_DB_PATH: /auth/auth.sqlite
    env_file:
      - path: /srv/secrets/myron-api.env # exists-but-empty today; confirm at cutover
        required: false
    volumes:
      # Notes/Books live outside the build context; the api reads ../data
      - /var/www/exploring-elan/data:/app/data
      - myron-auth:/auth
    expose:
      - "3001"

  myron-bot:
    build:
      context: /var/www/exploring-elan/bot
      dockerfile_inline: |
        FROM node:22-slim
        WORKDIR /app/bot
        COPY package.json package-lock.json ./
        RUN npm ci
        COPY . .
        CMD ["npx", "tsx", "src/index.ts"]
    restart: unless-stopped
    env_file:
      - /srv/secrets/myron-bot.env # DISCORD_BOT_TOKEN, OPENROUTER_API_KEY, whitelists
    volumes:
      - /var/www/exploring-elan/data:/app/data

  # chg-003: piano practice app at practice.vawagners.cloud (single user, Caddy basic auth).
  # App code lives in the practice repo and arrives as a `git archive` of a reviewed commit
  # in /opt/practice/app (its deploy/deploy.sh). The server owns its SQLite database for its
  # whole life; backups go through its maintenance socket (scripts/practice-backup.sh).
  practice:
    # Stable name: practice-backup.sh `docker exec practice …`.
    container_name: practice
    build:
      context: /opt/practice/app
      dockerfile_inline: |
        FROM node:24.16.0-bookworm-slim@sha256:2c87ef9bd3c6a3bd4b472b4bec2ce9d16354b0c574f736c476489d09f560a203
        ENV NODE_ENV=production
        WORKDIR /app
        COPY package.json package-lock.json ./
        RUN npm ci --omit=dev --no-audit --no-fund
        COPY src ./src
        COPY public ./public
        COPY config ./config
        # A new named volume copies this folder's ownership, so the app can write its home.
        RUN mkdir -p /var/lib/practice && chown node:node /var/lib/practice
        # chg-005: the converter spool's mount points; world-writable so a fresh volume works for the app
        # (uid 1000) and practice-convert (uid 10001), whichever container mounts it first.
        RUN mkdir -p /spool/convert/in /spool/convert/out && chmod 0777 /spool/convert/in /spool/convert/out
        USER node
        CMD ["node", "src/server.js"]
    restart: unless-stopped
    init: true
    environment:
      # None of these is a secret; authentication is Caddy's (caddy/Caddyfile).
      # The practice day (04:00 start), Session days and due dates follow the process's
      # time zone, as they did on the laptop; the box itself runs in UTC.
      TZ: America/New_York
      PRACTICE_HOME: /var/lib/practice
      PRACTICE_BIND: 0.0.0.0
      PRACTICE_PORT: "8770"
      # The only Host/Origin the app admits (it never reads forwarded headers).
      PRACTICE_PUBLIC_ORIGIN: https://practice.vawagners.cloud
      PRACTICE_ADMIN_SOCKET: /run/practice/admin.sock
      # collections.json roots are "../<Collection>": they resolve to /srv/exercises/<Collection>.
      PRACTICE_COLLECTIONS_BASE: /srv/exercises/practice
      # No MuseScore on the box: scans use MusicXML exported on the laptop (sidecars).
      PRACTICE_EXPORTER: sidecar
      PRACTICE_SIDECAR_DIR: /srv/practice-exports
      # chg-005: uploaded .mscz go to practice-convert through this spool (src/convert.js, practice-convert/1).
      PRACTICE_CONVERT_IN: /spool/convert/in
      PRACTICE_CONVERT_OUT: /spool/convert/out
    volumes:
      # Live database, pointer, restored copies and the app's own snapshots. Local volume
      # only: the app's POSIX locks need a local Linux filesystem.
      - practice-data:/var/lib/practice
      # Private notation, rsync'd byte-for-byte by the practice repo's deploy.sh. Never in
      # this repo or an image. create_host_path: false — a missing folder fails the start
      # instead of scanning an empty one.
      - type: bind
        source: /srv/practice/sources
        target: /srv/exercises
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /srv/practice/exports
        target: /srv/practice-exports
        read_only: true
        bind:
          create_host_path: false
      # chg-005: the converter spool. The app writes jobs to in/ and collects answers from out/.
      - practice-convert-in:/spool/convert/in
      - practice-convert-out:/spool/convert/out
    tmpfs:
      # Maintenance socket folder: in-container only, owned by the app's user, mode 700.
      - /run/practice:uid=1000,gid=1000,mode=0700
    networks:
      - practice
    expose:
      - "8770"
    # Box: 2 cores, 7.8 GB, no swap. The app is small; keep it from crowding the others.
    mem_limit: 768m
    cpus: 1.0

  # chg-005: MuseScore 4.6.5 converting uploaded .mscz to MusicXML (practice repo convert/, delivered with
  # the app by deploy/deploy.sh). It parses files from the internet, so it is boxed in: no network at all,
  # a read-only root, a non-root user, no capabilities, 1.5 GB with no swap (the box has none), 1 CPU,
  # 64 processes, 120 s per batch (inside). It sees only the spool: jobs read-only, answers writable. No
  # database, practice home, scores or secrets.
  practice-convert:
    container_name: practice-convert
    build:
      context: /opt/practice/app/convert
    restart: unless-stopped
    init: true
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=256m,mode=1777
    volumes:
      - practice-convert-in:/spool/in:ro
      - practice-convert-out:/spool/out
    mem_limit: 1536m
    memswap_limit: 1536m
    cpus: 1.0
    pids_limit: 64

  # litellm — retired to cold storage (decision 10). Config kept in litellm/.
  # Uncomment to resurrect; master key comes from /srv/secrets/litellm.env.
  # litellm:
  #   image: ghcr.io/berriai/litellm:main-stable
  #   restart: unless-stopped
  #   command: ["--config", "/app/config.yaml", "--port", "4000"]
  #   env_file:
  #     - /srv/secrets/litellm.env # LITELLM_MASTER_KEY
  #   volumes:
  #     - ./litellm/config.yaml:/app/config.yaml:ro
  #   expose:
  #     - "4000"

networks:
  # chg-003: internal — no route out, no host port; only caddy and practice are attached.
  practice:
    internal: true

volumes:
  todo-data:
  caddy-data:
  caddy-config:
  # Usernames and password hashes for exploring-elan's book-text search. Not in
  # the image and not under /var/www, so neither `up --build` nor the laptop's
  # `rsync --delete` of the build context can take the accounts with it.
  myron-auth:
  # The myron client ships as built `dist` files, rsync'd from the laptop to
  # the host path below (deploy step); caddy serves them read-only.
  myron-client-dist:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/www/exploring-elan/client/dist
  # chg-003: the practice app's home (live SQLite database, pointer, its own verified
  # snapshots). Backed up nightly through the app (scripts/practice-backup.sh).
  practice-data:
  # chg-005: the converter spool (transient jobs only; never backed up).
  practice-convert-in:
  practice-convert-out:
